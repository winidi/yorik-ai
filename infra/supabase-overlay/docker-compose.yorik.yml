# Yorik override for the bundled Supabase stack (copied next to the
# upstream docker-compose.yml by scripts/bootstrap-supabase.sh).
#
#  - supabase-db reachable from the host on 127.0.0.1:5435 — the app's
#    psycopg pool connects here directly, not through Supavisor.
#  - Supavisor's pooler host ports moved off 5432/6543 (a PostgreSQL on
#    the host is common) and bound to loopback. Nothing in Yorik uses
#    them; they stay for local tooling.
services:
  db:
    ports:
      - "127.0.0.1:5435:5432"
  supavisor:
    ports: !override
      - "127.0.0.1:5434:5432"
      - "127.0.0.1:6544:6543"
