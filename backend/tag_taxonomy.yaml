# Curated tag taxonomy for Yorik's autotagger.
#
# The LLM picks 0–3 tags from this CLOSED list per document — never
# invents new ones. Each tag carries DE + EN labels so it renders the
# right way for the user's UI language; the `id` is the stable key
# used in code and in Paperless's tag table.
#
# Why curated:
#   Free-form LLM tagging on a real 2500-doc corpus produces 200–500
#   unique tags with plural/singular dupes, DE/EN synonyms, and
#   useless "PDF"/"wichtig" tags. A closed vocabulary keeps Paperless
#   browsable and the folder-tree UI sane.
#
# How tags reach Paperless:
#   On first autotag run, the autotagger upserts each chosen tag into
#   Paperless's /api/tags/ using its DE label (matching what a German
#   user would already use). EN users see the EN label in the UI but
#   the underlying Paperless tag stays bilingual via the `slug` map.
#
# Users add their own tags in Paperless's UI any time — those don't
# need to live here; the LLM only PICKS from this file but doesn't
# REMOVE user-added tags.

# Per-category color (Paperless hex). Borrowed from the dock's tinted
# squircle palette so the same hue == same category across Yorik's UI
# and Paperless's tag pills.

categories:

  - id: finanzen
    label: { de: Finanzen, en: Finance }
    color: "#3b82f6"  # blue
    tags:
      - { id: rechnung_eingang,  label: { de: Rechnung,            en: Invoice } }
      - { id: quittung,          label: { de: Quittung,            en: Receipt } }
      - { id: kontoauszug,       label: { de: Kontoauszug,         en: Bank Statement } }
      - { id: gehaltsabrechnung, label: { de: Gehaltsabrechnung,   en: Payslip } }
      - { id: steuerbescheid,    label: { de: Steuerbescheid,      en: Tax Notice } }
      - { id: steuererklaerung,  label: { de: Steuererklärung,     en: Tax Return } }
      - { id: kredit,            label: { de: Kredit/Darlehen,     en: Loan } }
      - { id: mahnung,           label: { de: Mahnung,             en: Payment Reminder } }
      - { id: angebot_eingang,   label: { de: Angebot,             en: Quote } }
      - { id: lieferantenrechnung, label: { de: Lieferantenrechnung, en: Supplier Invoice } }

  - id: versicherung
