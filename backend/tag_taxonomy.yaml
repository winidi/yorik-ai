      - { id: hausrat,              label: { de: Hausratversicherung,         en: Home Contents Insurance } }
      - { id: kfz_versicherung,     label: { de: KFZ-Versicherung,            en: Vehicle Insurance } }
      - { id: lebens_versicherung,  label: { de: Lebensversicherung,          en: Life Insurance } }
      - { id: rechtsschutz,         label: { de: Rechtsschutz,                en: Legal Insurance } }
      - { id: berufsunfaehigkeit,   label: { de: Berufsunfähigkeitsversicherung, en: Disability Insurance } }
      - { id: versicherungs_police, label: { de: Versicherungspolice,         en: Insurance Policy } }
      - { id: schadensmeldung,      label: { de: Schadensmeldung,             en: Insurance Claim } }

  - id: wohnen
