name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest tests/ -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install + build
        working-directory: frontend-react
        run: |
          npm ci
          npm run build

  dco:
    name: DCO signoff check
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signoffs
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MISSING=$(git log --format='%H %s%n%b' "$BASE..$HEAD" | \
            awk '/^[a-f0-9]{40}/ {sha=$1; signed=0} /^Signed-off-by:/ {signed=1} END {if(!signed) print sha}')
          if [ -n "$MISSING" ]; then
            echo "::error::Commits missing DCO signoff. Use 'git commit -s'. Missing: $MISSING"
            exit 1
          fi
