name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Before filing, please check if there's already an [open Discussion](https://github.com/winidi/yorik-ai/discussions) about this — early-stage ideas are usually better in Discussions than as Issues.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user need. Not the solution yet — the problem.
      placeholder: "When I do X, I have to manually Y because Z is missing."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like Yorik to solve this?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or other tools that solve this differently.

  - type: dropdown
    id: scope
    attributes:
      label: Which app would this affect?
      multiple: true
      options:
        - Chat
        - Calendar
        - Tasks
        - Bills
        - Documents
        - Compose
        - Email
        - WhatsApp
        - Photos
        - Settings
        - Apps / permissions
        - Backend / API (no UI)
        - Install / start scripts
        - Voice (STT / TTS / speaker ID)
        - Docs

  - type: dropdown
    id: who-benefits
    attributes:
      label: Who benefits most?
      options:
        - German small business owners (e-invoicing, GoBD)
        - Families with shared calendar/docs/photos
        - Self-hosters / homelab admins
        - Multi-language users (non-EN/DE)
        - Voice-first users
        - Power users / developers

  - type: checkboxes
    id: contribution
    attributes:
      label: Are you willing to help implement this?
      options:
        - label: Yes, I can submit a PR
        - label: Yes, I can help test
        - label: No, just suggesting
